<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bistro U Studenta | Rezervace</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Bistro U Studenta</h1>
        <nav>
            <a href="index.html">Domů – informace</a>
            <a href="cenik.html">Ceník</a>
            <a href="rezervace.html">Rezervace</a>
        </nav>
    </header>
    <main>
        <section>
            <h2>Rezervace stolu</h2>
            <p>Vyplňte formulář a připravíme pro vás místo.</p>
            <form action="#" method="post">
                <div class="form-group">
                    <label for="jmeno">Jméno:</label>
                    <input type="text" id="jmeno" name="jmeno">
                </div>
                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email">
                </div>
                <div class="form-group">
                    <label for="osoby">Počet osob:</label>
                    <input type="number" id="osoby" name="osoby">
                </div>
                <div class="form-group">
                    <label for="cas">Výběr času:</label>
                    <select id="cas" name="cas">
                        <option value="10">10:00</option>
                        <option value="12">12:00</option>
                        <option value="14">14:00</option>
                        <option value="16">16:00</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="zprava">Zpráva:</label>
                    <textarea id="zprava" name="zprava"></textarea>
                </div>
                <button type="submit">Odeslat</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Bistro U Studenta</p>
    </footer>
</body>
</html>
